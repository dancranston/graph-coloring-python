const grayAt=[48, 48, 17, 0, 2, 17, null, 38, 8, 1, 1, 2, 8, 1, 49, 8, 8, 17, null, 2, 7, 60, 0, 0, 0, 8, 49, 7, 49, 0];
const dgrayAt=[49, null, null, 1, null, null, null, null, 17, 2, null, null, null, null, 60, 48, 38, 23, null, 7, 8, 62, null, null, null, null, null, 82, null, null];
const blackAt=[90, 79, 19, 111, 83, 31, 0, 41, 100, 109, 74, 4, 10, 68, 70, 92, 95, 25, 0, 106, 104, 64, 34, 24, 44, 14, 51, 84, 55, 63];
const changed=[[23, 22, 24, 29, 3, 18, 6], [9, 10, 13, 3], [11, 19, 4, 9], [], [11], [], [], [20, 27, 19], [12, 25, 8, 16, 15, 20], [], [12], [], [], [], [25], [], [], [2, 17, 5, 8], [], [2], [], [], [], [17], [23], [17], [], [], [], [], [], [5], [], [], [22], [], [], [], [7, 16], [], [], [7], [], [], [24], [], [], [], [0, 1, 15], [26, 28, 14, 0], [], [26], [], [], [], [28], [], [], [], [], [21, 14], [], [21], [29], [21], [], [], [], [13], [], [14], [], [], [], [10], [], [], [], [], [1], [], [], [27], [4], [27], [], [], [], [], [], [0], [], [15], [], [], [16], [], [], [], [], [8], [], [], [], [20], [], [19], [], [], [9], [], [3], []];
const colorChangeFrames=[0, 1, 2, 4, 7, 8, 10, 14, 17, 19, 23, 24, 25, 31, 34, 38, 41, 44, 48, 49, 51, 55, 60, 62, 63, 64, 68, 70, 74, 79, 82, 83, 84, 90, 92, 95, 100, 104, 106, 109, 111];
const processedAt=[90, 92, 92, 90, 90, 90, 83, 92, 84, 79, 25, 19, 100, 100, 24, 111, 111, 111, 111, 109, 106, 109, 41, 34, 31, 100, 100, 95, 10, 14, 4, 95, 51, 44, 104, 104, 109, 109, 74, 106, 104, 104, 70, 68, 70, 104, 104, 106, 64, 55, 63];
const color1="#145a32", color2="#4f9a68", color3="#b7d9c0";
const faceShade="#eeeeee", highlight="#ffd700";
const baseInterval=500;

let current=0, playing=false, timer=null, colorOnly=false;

const cycle=document.getElementById("cycle");
const slider=document.getElementById("slider");
const label=document.getElementById("label");
const status=document.getElementById("status");
const speed=document.getElementById("speed");
const colorOnlyBox=document.getElementById("colorOnly");
const vertices=document.querySelectorAll(".vertex");
const faces=document.querySelectorAll(".face");

function frames() {
    return colorOnly ? colorChangeFrames : cycles.map((_,i)=>i);
}

function show(i) {
    const f=frames();
    current=(i+f.length)%f.length;
    const frame=f[current];

    cycle.setAttribute("points",cycles[frame]);
    slider.value=current;
    label.textContent=`Cycle ${frame+1} / ${cycles.length}`;

    vertices.forEach((v,j) => {
        v.setAttribute("fill",
            blackAt[j] !== null && blackAt[j] <= frame ? color1 :
            dgrayAt[j] !== null && dgrayAt[j] <= frame ? color2 :
            grayAt[j] !== null && grayAt[j] <= frame ? color3 : "white");

        const h=changed[frame].includes(j);
        v.setAttribute("stroke",h ? highlight : "black");
        v.setAttribute("stroke-width",h ? 3 : 1);
    });

    faces.forEach((face,j) =>
        face.setAttribute("fill",
            processedAt[j] !== null && processedAt[j] <= frame
                ? faceShade : "none"));

    status.textContent =
        `Vertices colored ${blackAt.filter(t => t !== null && t <= frame).length} / ${vertices.length}`;
}

function restart() {
    if (timer) clearInterval(timer);
    if (playing)
        timer=setInterval(() => show(current+1),
                          baseInterval/Number(speed.value));
}

prev.onclick=()=>show(current-1);
next.onclick=()=>show(current+1);
slider.oninput=()=>show(Number(slider.value));

play.onclick=()=>{
    playing=!playing;
    play.textContent=playing ? "Pause" : "Play";
    restart();
};

speed.onchange=restart;

colorOnlyBox.onchange=()=>{
    const frame=frames()[current];
    colorOnly=colorOnlyBox.checked;
    const f=frames();
    slider.max=f.length-1;
    let i=f.indexOf(frame);
    if (i < 0) {
        i=f.findIndex(x=>x>frame);
        if (i < 0) i=f.length-1;
    }
    show(i);
};

show(0);
</script>
